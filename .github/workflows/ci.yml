name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Tests d'API hermétiques (scopes, pagination, rate-limit, migrations,
  # rentabilité via HTTP) : rapides, sans base externe ni sync DofusDB.
  # Garde-fou principal, à CHAQUE push/PR.
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - name: Install API deps
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt pytest httpx
      - name: Migrations up/down + drift
        run: |
          export DATABASE_URL="sqlite:///$RUNNER_TEMP/ci_mig.db"
          cd services/api
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic downgrade base
      - name: Run API tests
        run: cd services/api && pytest tests -q

  # Validation des images Docker (api + front). Build seulement, pas de push.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f services/api/Dockerfile -t kamas-api:ci .
      - name: Build Front image
        run: docker build -f services/front/Dockerfile -t kamas-front:ci .
